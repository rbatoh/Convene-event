on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend-env
      - name: Lint
        run: ruff check backend/
      - name: Unit tests
        run: pytest tests/backend/ || true
      - name: Security scan
        run: |
          bandit -r backend/ || true
          pip-audit || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Frontend install & test
        working-directory: frontend
        run: |
          npm install
          npm run test -- --run
          npm run build
      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: SAM validate
        run: sam validate --template infrastructure/template.yaml
      - name: SAM build
        run: sam build --template infrastructure/template.yaml --use-container
      - uses: actions/upload-artifact@v4
        with: { name: sam-build, path: .aws-sam/build }
